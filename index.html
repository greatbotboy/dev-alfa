<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Garflix - Home</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <h1>The Dogs</h1>
  <p>Crazy dogs that run around my house.</p>

  <hr>

  <!-- LAYOUT TABLE: puts the 3 sections side-by-side, 90's style -->
  <table border="0" cellpadding="10" cellspacing="0" align="center" width="100%">
    <tr valign="top">

      <!-- SECTION 1: HTML table with info + link -->
      <td align="center">
        <table border="1" cellpadding="5" cellspacing="0" align="center">
          <tr>
            <th colspan="2">Tuna Facts</th>
          </tr>
          <tr>
            <td>DOB</td>
            <td>6/1/2025</td>
          </tr>
          <tr>
            <td>Species</td>
            <td>Ausie</td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <a href="https://en.wikipedia.org/wiki/Australian_Shepherd" target="_blank">Read more on Wikipedia</a>
            </td>
          </tr>
        </table>
      </td>
      <td align="center">
        <table border="1" cellpadding="5" cellspacing="0" align="center">
          <tr>
            <th colspan="2">June Bug Facts</th>
          </tr>
          <tr>
            <td>DOB</td>
            <td>6/16/2026</td>
          </tr>
          <tr>
            <td>Species</td>
            <td>Golden</td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <a href="https://en.wikipedia.org/wiki/Golden_Retriever" target="_blank">Read more on Wikipedia</a>
            </td>
          </tr>
        </table>
      </td>
      <!-- SECTION 2: image, relative path -->
      <td align="center">
        <h2>Tuna and Bug (relative path image)</h2>
        <img src="assets/img/dogs1.jpg" alt="Garfield" width="300">
      </td>

      <!-- SECTION 3: image, absolute path -->
      <td align="center">
        <h2>Tuna and Bug (absolute path image)</h2>
        <img src="https://greatbotboy.github.io/dev-alfa/assets/img/dogs2.jpg" alt="Garfield again" width="300">
      </td>

    </tr>
  </table>

  <hr>

  <footer>
    <center>
      <p>
        <a href="https://github.com/greatbotboy" target="_blank">My GitHub Profile</a>
        |
        <a href="https://greatbotboy.github.io/dev-alfa/" target="_blank">Source Code</a>
      </p>
    </center>
  </footer>

  <script src="assets/scripts/script.js"></script>
</body>
</html>
